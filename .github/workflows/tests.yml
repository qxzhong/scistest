name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,experiments,forest]'
      - run: pytest
      - run: ruff check .
      - run: python -m simulations.run --dry-run
      - run: python -m dataApplication.run_framingham --dry-run
      - run: python -m build
      - run: python -m twine check dist/*
