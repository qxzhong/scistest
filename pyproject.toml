[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scistest"
version = "0.2.0"
description = "Conditional independence testing for right-censored survival outcomes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Qixian Zhong", email = "qxzhong@xmu.edu.cn" },
  { name = "Rajen Shah", email = "rds37@cam.ac.uk" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["conditional independence", "survival analysis", "hypothesis testing"]
dependencies = [
  "engression==0.1.15",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/qxzhong/scistest"
Repository = "https://github.com/qxzhong/scistest"
Issues = "https://github.com/qxzhong/scistest/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

forest = ["clarabel==0.11.1"]
experiments = ["pandas>=2", "matplotlib>=3.7", "SurvSet>=0.2"]
comparators = ["pandas>=2", "scikit-learn>=1.3", "pycox>=0.3", "torchtuples>=0.2", "lifelines>=0.27"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/simulations", "/dataApplication", "/docs", "/.github", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/results", "**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/scistest", "src/scitest"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"simulations/comparators/deep_test.py" = ["ALL"]

"dataApplication/run_framingham.py" = ["E402"]
